name: Gen FASTLANE_SESSION

on:
  workflow_dispatch:

env:
  FASTLANE_USER: ${{ secrets.APPLE_ID }}
  FASTLANE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}

jobs:
  gen:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fastlane + expect
        run: |
          sudo gem install fastlane -N
          brew install expect

      - name: Generate session (expect-driven 2FA)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f /tmp/code.txt /tmp/code.txt.tmp
          # 后台轮询：用 gh api（带 token，私有仓库可读）取 pending_code.txt
          ( while true; do
              gh api "repos/${{ github.repository }}/contents/pending_code.txt" --jq -r '.content' 2>/dev/null \
                | python3 -c "import base64,sys; sys.stdout.write(base64.b64decode(sys.stdin.read()).decode())" 2>/dev/null \
                | tr -d '[:space:]' > /tmp/code.txt.tmp
              if [ -s /tmp/code.txt.tmp ]; then mv -f /tmp/code.txt.tmp /tmp/code.txt; fi
              sleep 3
            done ) &
          FETCHER=$!

          cat > /tmp/drive.exp <<'EXP'
          #!/usr/bin/expect -f
          set timeout 600
          spawn fastlane spaceauth
          expect {
            -re "6 digit code" { }
            timeout { puts "TIMEOUT_NO_PROMPT"; exit 2 }
          }
          set code ""
          while { $code eq "" } {
            if { [file exists /tmp/code.txt] } {
              set fh [open /tmp/code.txt r]
              set data [read $fh]
              close $fh
              set data [string trim $data]
              if { $data ne "" } { set code $data }
            }
            if { $code eq "" } { sleep 3 }
          }
          send "$code\r"
          expect {
            -re "copy it verbatim" { }
            timeout { puts "TIMEOUT_NO_SESSION"; exit 3 }
          }
          expect eof
          EXP

          expect -f /tmp/drive.exp 2>&1 | tee /tmp/sa.log
          kill $FETCHER 2>/dev/null || true

      - name: Extract session
        if: always()
        run: |
          SESSION=$(ruby -rjson -e 's=STDIN.read; i=s.index("copy it verbatim:"); exit(1) unless i; seg=s[i..]; a=seg.index("{"); b=seg.rindex("}"); json=seg[a..b]; JSON.parse(json); print json' < /tmp/sa.log 2>/dev/null)
          if [ -z "$SESSION" ]; then echo "NO_SESSION_FOUND"; else echo "$SESSION" > /tmp/session.txt; echo "SESSION_OK len=${#SESSION}"; fi

      - name: Print session for operator
        if: always()
        run: |
          echo "=====FASTLANE_SESSION_START====="
          cat /tmp/session.txt 2>/dev/null || echo "none"
          echo "=====FASTLANE_SESSION_END====="
