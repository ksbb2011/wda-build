name: Gen FASTLANE_SESSION

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Apple 2FA 6-digit code"
        required: true

env:
  FASTLANE_USER: ${{ secrets.APPLE_ID }}
  FASTLANE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}

jobs:
  gen:
    runs-on: macos-latest
    steps:
      - name: Install fastlane
        run: sudo gem install fastlane -N

      - name: spaceauth (feed 2FA code via stdin)
        run: |
          echo "${{ github.event.inputs.code }}" | fastlane spaceauth 2>&1 | tee /tmp/sa.log

      - name: Extract session
        run: |
          SESSION=$(ruby -rjson -e 's=STDIN.read; i=s.index("copy it verbatim:"); exit(1) unless i; seg=s[i..]; a=seg.index("{"); b=seg.rindex("}"); json=seg[a..b]; JSON.parse(json); print json' < /tmp/sa.log 2>/dev/null)
          if [ -z "$SESSION" ]; then echo "NO_SESSION_FOUND"; echo "----- raw sa.log -----"; cat /tmp/sa.log; else echo "$SESSION" > /tmp/session.txt; echo "SESSION_OK len=${#SESSION}"; fi

      - name: Print session for operator
        if: always()
        run: |
          echo "=====FASTLANE_SESSION_START====="
          cat /tmp/session.txt 2>/dev/null || echo "none"
          echo "=====FASTLANE_SESSION_END====="
