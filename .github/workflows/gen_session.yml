name: Gen FASTLANE_SESSION

on:
  workflow_dispatch:

permissions: write-all

env:
  FASTLANE_USER: ${{ secrets.APPLE_ID }}
  FASTLANE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}

jobs:
  gen:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fastlane + expect
        run: |
          sudo gem install fastlane -N
          brew install expect

      - name: Generate session (expect-driven 2FA)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f /tmp/code.txt /tmp/code.txt.tmp /tmp/sa.log /tmp/fetch.log
          # 后台轮询：用 gh api（带 token，私有仓库可读）取 pending_code.txt
          ( while true; do
              gh api "repos/${{ github.repository }}/contents/pending_code.txt" --jq -r '.content' 2>/dev/null \
                | python3 -c "import base64,sys; sys.stdout.write(base64.b64decode(sys.stdin.read()).decode())" 2>/dev/null \
                | tr -d '[:space:]' > /tmp/code.txt.tmp
              if [ -s /tmp/code.txt.tmp ]; then mv -f /tmp/code.txt.tmp /tmp/code.txt; echo "FETCHED [$(cat /tmp/code.txt)]" >> /tmp/fetch.log; fi
              sleep 1
            done ) &
          FETCHER=$!

          cat > /tmp/drive.exp <<'EXP'
          #!/usr/bin/expect -f
          set timeout 600
          spawn fastlane spaceauth
          expect {
            -re "code|verification" { send_user "PROMPT_SEEN\n" }
            timeout { send_user "TIMEOUT_NO_PROMPT\n"; exit 2 }
          }
          set code ""
          set tries 0
          while { $code eq "" && $tries < 400 } {
            if { [file exists /tmp/code.txt] } {
              set fh [open /tmp/code.txt r]
              set data [read $fh]
              close $fh
              set data [string trim $data]
              if { $data ne "" } { set code $data }
            }
            if { $code eq "" } { incr tries; sleep 2 }
          }
          if { $code eq "" } { send_user "NO_CODE_FILE\n"; exit 4 }
          send_user "CODE_SENT=$code\n"
          send "$code\r"
          expect {
            -re "FASTLANE_SESSION" { send_user "SESSION_DETECTED\n" }
            -re "code|verification" {
              send_user "REPROMPT\n"
              set code2 ""
              for {set i 0} {$i < 200 && $code2 eq ""} {incr i} {
                if {[file exists /tmp/code.txt]} {
                  set fh [open /tmp/code.txt r]; set d [read $fh]; close $fh
                  set d [string trim $d]; if {$d ne ""} {set code2 $d}
                }
                if {$code2 eq ""} {sleep 2}
              }
              if {$code2 ne ""} { send_user "CODE_SENT2=$code2\n"; send "$code2\r" }
              expect {
                -re "FASTLANE_SESSION" { send_user "SESSION_DETECTED\n" }
                timeout { send_user "TIMEOUT_NO_SESSION\n"; exit 3 }
              }
            }
            timeout { send_user "TIMEOUT_NO_SESSION\n"; exit 3 }
          }
          expect eof
          EXP

          expect -f /tmp/drive.exp 2>&1 | tee /tmp/sa.log
          kill $FETCHER 2>/dev/null || true

      - name: Extract session (YAML)
        if: always()
        run: |
          SESSION=$(ruby -e 's=STDIN.read; m=s.match(/--- !ruby\/object:HTTP::CookieJar.*/m); (m ? (print m[0]) : (exit 1))' < /tmp/sa.log 2>/dev/null)
          if [ -z "$SESSION" ]; then echo "NO_SESSION_FOUND"; else echo "$SESSION" > /tmp/session.txt; echo "SESSION_OK len=${#SESSION}"; fi

      - name: Set FASTLANE_SESSION secret
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SESSION=$(cat /tmp/session.txt 2>/dev/null)
          if [ -z "$SESSION" ]; then echo "NO_SESSION"; exit 0; fi
          gh secret set FASTLANE_SESSION -b "$SESSION"
          echo "SECRET_SET"

      - name: Trigger build_wda
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build_wda.yml -f bundle_id=com.ksbb.wdarunner
          echo "BUILD_DISPATCHED"

      - name: Print diagnostics for operator
        if: always()
        run: |
          echo "=====FETCH_LOG====="
          cat /tmp/fetch.log 2>/dev/null || echo "none"
          echo "=====SA_LOG (tail)====="
          tail -n 50 /tmp/sa.log 2>/dev/null || echo "none"
          echo "=====SESSION====="
          cat /tmp/session.txt 2>/dev/null || echo "none"
