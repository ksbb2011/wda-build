name: Build WDA (free Apple ID)

# 免费账号方案：不用 fastlane cert/sigh（那些要付费团队），改用 Xcode 自动签名 + 免费 Personal Team。
# 前提：本 Apple ID 已在本机 Mac 上「用于开发」登记过目标设备 UDID（一次性，见说明）。
# CI 用 GitHub 免费 macOS runner 上的最新 Xcode 编译并免费签名，产出 WDA.ipa。

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "WDA bundle id (必须唯一)"
        required: true
        default: "com.ksbb.wdarunner"

env:
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
  UDID: ${{ secrets.UDID }}
  BUNDLE_ID: ${{ github.event.inputs.bundle_id }}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone WebDriverAgent & change bundle id
        run: |
          git clone --depth 1 https://github.com/appium/WebDriverAgent.git
          cd WebDriverAgent
          ./Scripts/bootstrap.sh -d || true
          sed -i '' "s/com.facebook.WebDriverAgentLib/${BUNDLE_ID}lib/g" WebDriverAgent.xcodeproj/project.pbxproj
          sed -i '' "s/com.facebook.WebDriverAgentRunner/${BUNDLE_ID}/g" WebDriverAgent.xcodeproj/project.pbxproj
          # 强制自动签名，清掉工程里写死的 team
          sed -i '' 's/CODE_SIGN_STYLE = Manual/CODE_SIGN_STYLE = Automatic/g' WebDriverAgent.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*/DEVELOPMENT_TEAM = ""/g' WebDriverAgent.xcodeproj/project.pbxproj

      - name: Add Apple ID to Xcode (free Personal Team)
        run: |
          # 把 Apple ID 凭据写入 keychain，Xcode 自动签名时会用它登录并创建免费开发证书/描述文件
          security add-generic-password -a "$APPLE_ID" -s "com.apple.dt.Xcode" \
            -w "$APPLE_ID_PASSWORD" -T /usr/bin/security -T /usr/bin/codesign -T /usr/bin/xcodebuild \
            2>/dev/null || security add-generic-password -a "$APPLE_ID" -s "com.apple.dt.Xcode" \
            -w "$APPLE_ID_PASSWORD" -T /usr/bin/security -T /usr/bin/codesign -T /usr/bin/xcodebuild -U
          /usr/libexec/PlistBuddy -c "Add :IDEProvisioningTeams dict" \
            ~/Library/Preferences/com.apple.dt.Xcode.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :IDEProvisioningTeams:$APPLE_ID dict" \
            ~/Library/Preferences/com.apple.dt.Xcode.plist 2>/dev/null || true
          echo "keychain Xcode accounts:"; security find-generic-password -s com.apple.dt.Xcode 2>/dev/null | grep -c acct || true

      - name: Build & sign WDA (Xcode 自动签名 / Personal Team)
        run: |
          xcodebuild -project WebDriverAgent/WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath WebDriverAgent/build \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            build
        env:
          CI: "true"

      - name: Package .app -> WDA.ipa
        run: |
          APP=$(find WebDriverAgent/build -name 'WebDriverAgentRunner-Runner.app' -type d | head -1)
          if [ -z "$APP" ]; then echo "BUILD FAILED"; find WebDriverAgent/build -name '*.app'; exit 1; fi
          rm -rf Payload && mkdir Payload
          cp -r "$APP" Payload/
          zip -r WDA.ipa Payload
          ls -la WDA.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WDA.ipa
          path: WDA.ipa
