name: Build WDA (unsigned for Sideloadly)

# 方案：CI 只负责编译「免签名」的 WDA.ipa（GitHub 免费 macOS runner）。
# 设备登记 + 签名 + 安装全部由 Windows 上的 Sideloadly 完成（免费 Apple ID，7 天有效，过期重签即可）。
# 这样绕开「CI 免费签名必须先登记设备」的死循环：Sideloadly 签名时自动登记设备。

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "WDA bundle id (必须唯一)"
        required: true
        default: "com.ksbb.wdarunner"

env:
  BUNDLE_ID: ${{ github.event.inputs.bundle_id }}

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 15.x (iOS 16.7 compatible Testing.framework)
        # Xcode 16+ 嵌入的 Testing.framework 依赖 lib_TestingInterop.dylib，
        # 该库只在 iOS17+ 的 dyld 缓存里存在，iOS16.7 启动即 DYLD 崩溃。
        # Xcode 15.x 编出的 Testing.framework 不含此依赖，可原生跑在 iOS16.7。
        run: |
          XC=$(ls -d /Applications/Xcode_15*.app 2>/dev/null | head -1)
          if [ -z "$XC" ]; then echo "Xcode 15 not found; available Xcodes:"; ls /Applications | grep -i xcode; exit 1; fi
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Clone WebDriverAgent & change bundle id
        run: |
          git clone --depth 1 https://github.com/appium/WebDriverAgent.git
          cd WebDriverAgent
          ./Scripts/bootstrap.sh -d || true
          sed -i '' "s/com.facebook.WebDriverAgentLib/${BUNDLE_ID}lib/g" WebDriverAgent.xcodeproj/project.pbxproj
          sed -i '' "s/com.facebook.WebDriverAgentRunner/${BUNDLE_ID}/g" WebDriverAgent.xcodeproj/project.pbxproj

      - name: Build WDA (unsigned)
        run: |
          xcodebuild -project WebDriverAgent/WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath WebDriverAgent/build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package .app -> WDA.ipa
        run: |
          APP=$(find WebDriverAgent/build -name 'WebDriverAgentRunner-Runner.app' -type d | head -1)
          if [ -z "$APP" ]; then echo "BUILD FAILED"; find WebDriverAgent/build -name '*.app'; exit 1; fi
          # 剔除 dSYM 调试符号（Sideloadly 给它签名会报 macho sign/edit failed -40，且运行用不到）
          find "$APP" -name '*.dSYM' -type d -exec rm -rf {} + 2>/dev/null || true
          rm -rf Payload && mkdir Payload
          cp -r "$APP" Payload/
          zip -r WDA.ipa Payload
          ls -la WDA.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WDA-unsigned
          path: WDA.ipa
